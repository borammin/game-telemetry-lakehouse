name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements.txt
      - name: Unit and API tests
        run: pytest -q
      - name: Pipeline smoke test (small dataset)
        run: |
          python generator/generate_events.py --rows 50000 --out data/raw
          python pipeline/medallion.py
      - name: Build Docker image
        run: docker build -t game-telemetry-lakehouse .
